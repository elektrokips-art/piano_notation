org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Инкрементальная компиляция Kotlin падает, когда проект (D:) и кэш пакетов
# pub/Gradle (обычно на C:) лежат на разных дисках — компилятор не может
# посчитать относительный путь между корнями дисков и кидает
# "this and base files have different roots". Известный баг Kotlin на
# Windows. Отключаем инкрементальность — сборка чуть медленнее, зато не падает.
kotlin.incremental=false
