<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- ножки чипа -->
  <g fill="#ff8800">
    <!-- сверху -->
    <rect x="34" y="18" width="6" height="14" rx="1.5"/>
    <rect x="47" y="18" width="6" height="14" rx="1.5"/>
    <rect x="60" y="18" width="6" height="14" rx="1.5"/>
    <!-- снизу -->
    <rect x="34" y="68" width="6" height="14" rx="1.5"/>
    <rect x="47" y="68" width="6" height="14" rx="1.5"/>
    <rect x="60" y="68" width="6" height="14" rx="1.5"/>
    <!-- слева -->
    <rect x="18" y="34" width="14" height="6" rx="1.5"/>
    <rect x="18" y="47" width="14" height="6" rx="1.5"/>
    <rect x="18" y="60" width="14" height="6" rx="1.5"/>
    <!-- справа -->
    <rect x="68" y="34" width="14" height="6" rx="1.5"/>
    <rect x="68" y="47" width="14" height="6" rx="1.5"/>
    <rect x="68" y="60" width="14" height="6" rx="1.5"/>
  </g>
  <!-- тело чипа -->
  <rect x="26" y="26" width="48" height="48" rx="6" fill="#ff8800"/>
  <!-- буква i -->
  <rect x="47" y="38" width="6" height="24" rx="2" fill="#ffffff"/>
  <rect x="47" y="32" width="6" height="6" rx="2" fill="#ffffff"/>
</svg>
